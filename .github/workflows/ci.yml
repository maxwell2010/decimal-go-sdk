name: Go SDK checks
on:
  push:
    paths-ignore: ['latest.json']
  pull_request:
    paths-ignore: ['latest.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s tools -p 'test_*.py'
      - run: go mod verify
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
      - if: runner.os == 'Linux'
        run: go test -race ./...
      - if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - if: runner.os == 'Linux'
        run: |
          go test -run '^$' -fuzz '^FuzzChecksEventDecoding$' -fuzztime 7s -parallel 2 .
          go test -run '^$' -fuzz '^FuzzChecksReceiptDecoding$' -fuzztime 7s -parallel 2 .
          go test -run '^$' -fuzz '^FuzzChecksSignatureRecovery$' -fuzztime 7s -parallel 2 .
          go test -run '^$' -fuzz '^FuzzDelegationStakeDecoding$' -fuzztime 7s -parallel 2 .
          go test -run '^$' -fuzz '^FuzzDelegationEventsAndReceipts$' -fuzztime 7s -parallel 2 .
      - run: python -B tools/release.py
  cosmos:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cosmos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: cosmos/go.sum
      - run: go mod verify
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
      - if: runner.os == 'Linux'
        run: go test -race ./...
      - if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
  fixture-rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          mkdir -p .tools/local-evm-compiler
          cp testdata/evm/compiler-package.json .tools/local-evm-compiler/package.json
          cp testdata/evm/compiler-package-lock.json .tools/local-evm-compiler/package-lock.json
          npm ci --prefix .tools/local-evm-compiler --ignore-scripts --no-audit --no-fund
          python -B tools/rebuild_local_evm_fixture.py .tools/local-evm-compiler/node_modules/solc --check
          python -B tools/rebuild_permit_fixture.py .tools/local-evm-compiler/node_modules/solc --check
          curl --fail --location --retry 3 --max-time 30 --output .tools/DecimalDelegation.go https://raw.githubusercontent.com/decimalteam/go-smart-node/a46cb48d7965c1a64a495cebb22e735dfe4b9da3/contracts/delegation/DecimalDelegation.go
          python -B tools/rebuild_delegation_compat.py .tools/DecimalDelegation.go --check
